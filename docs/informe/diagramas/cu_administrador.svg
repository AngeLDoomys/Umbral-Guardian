<text x="685.0" y="61" font-size="13.5" font-weight="bold" fill="#1f3a68" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="685.0" dy="0">Umbral Guardian</tspan></text>
<text x="90" y="659.0" font-size="13" font-weight="bold" fill="#2d3340" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="90" dy="0">Administrador del</tspan><tspan x="90" dy="17.55">condominio</tspan></text>
<text x="520" y="144" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Iniciar sesión</tspan></text>
<text x="520" y="234" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Registrar un residente</tspan></text>
<text x="520" y="262" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif" font-style="italic"><tspan x="520" dy="0">puntos de extensión</tspan></text>
<text x="520" y="278" font-size="10.5" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">captura de la plantilla facial</tspan></text>
<text x="520" y="368" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Administrar los vehículos del</tspan><tspan x="520" dy="16.200000000000003">residente</tspan></text>
<text x="520" y="466" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Dar de baja a un residente</tspan></text>
<text x="520" y="556" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Administrar las cámaras y las zonas</tspan></text>
<text x="520" y="646" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Generar reportes de acceso</tspan></text>
<text x="520" y="728" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Atender solicitudes de derechos del</tspan><tspan x="520" dy="16.200000000000003">titular</tspan></text>
<text x="520" y="826" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Generar una invitación QR</tspan></text>
<text x="520" y="916" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Revisar una solicitud de registro</tspan></text>
<text x="520" y="944" font-size="10" font-weight="normal" fill="#5b6270" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif" font-style="italic"><tspan x="520" dy="0">puntos de extensión</tspan></text>
<text x="520" y="960" font-size="10.5" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">aprobación de la solicitud</tspan></text>
<text x="520" y="1058" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="520" dy="0">Administrar las visitas autorizadas</tspan></text>
<text x="970" y="260" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="970" dy="0">Capturar la plantilla facial</tspan></text>
<text x="970" y="934" font-size="12" font-weight="normal" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="970" dy="0">Crear el residente o la</tspan><tspan x="970" dy="16.200000000000003">visita autorizada</tspan></text>
<text x="749.0" y="247.0" font-size="11" font-weight="bold" fill="#3d4450" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="749.0" dy="0">«extend»</tspan></text>
<text x="749.0" y="929.0" font-size="11" font-weight="bold" fill="#3d4450" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="749.0" dy="0">«extend»</tspan></text>
<text x="970" y="321" font-size="10.5" font-weight="normal" fill="#4a4f5a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="970" dy="0">Condición: el residente otorga el</tspan><tspan x="970" dy="13.65">consentimiento informado. Punto de extensión:</tspan><tspan x="970" dy="13.65">captura de la plantilla facial.</tspan></text>
<text x="970" y="1003" font-size="10.5" font-weight="normal" fill="#4a4f5a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="970" dy="0">Condición: los datos, el consentimiento</tspan><tspan x="970" dy="13.65">y las fotos son válidos. Punto de extensión:</tspan><tspan x="970" dy="13.65">aprobación de la solicitud.</tspan></text>
<text x="230" y="1156" font-size="11.5" font-weight="normal" fill="#59606c" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif" font-style="italic"><tspan x="230" dy="0">Nota. La obtención del consentimiento forma parte de «Registrar un residente»: no se dibuja como caso incluido porque ningún otro caso de uso lo comparte.</tspan></text></svg>