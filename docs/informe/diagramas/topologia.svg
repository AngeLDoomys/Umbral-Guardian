<text x="57" y="701" font-size="15" font-weight="bold" fill="#6b4a08" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="57" dy="0">El video nunca sale del condominio.</tspan></text>
<text x="57" y="725" font-size="12" font-weight="normal" fill="#6b4a08" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="57" dy="0">Se procesa en la caseta y sólo sube el registro del ingreso. La conexión del nodo siempre la abre el nodo: desde internet no hay forma de entrar. El celular sólo habla con la nube, nunca con el nodo.</tspan></text></svg>