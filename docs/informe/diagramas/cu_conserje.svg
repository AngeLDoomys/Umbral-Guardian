<text x="749.0" y="839.0" font-size="11" font-weight="bold" fill="#3d4450" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="749.0" dy="0">«extend»</tspan></text>
<text x="970" y="681" font-size="10.5" font-weight="normal" fill="#4a4f5a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="970" dy="0">Condición: el conserje pide ver el historial</tspan><tspan x="970" dy="13.65">del residente encontrado. Punto de extensión:</tspan><tspan x="970" dy="13.65">consulta del historial.</tspan></text>
<text x="970" y="913" font-size="10.5" font-weight="normal" fill="#4a4f5a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="970" dy="0">Condición: los datos, el consentimiento</tspan><tspan x="970" dy="13.65">y las fotos son válidos. Punto de extensión:</tspan><tspan x="970" dy="13.65">aprobación de la solicitud.</tspan></text>
<text x="230" y="1066" font-size="11.5" font-weight="normal" fill="#59606c" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif" font-style="italic"><tspan x="230" dy="0">Nota. La sincronización con la nube es responsabilidad interna de «Iniciar sesión» y se detalla en su descripción textual, no en el diagrama.</tspan></text></svg>