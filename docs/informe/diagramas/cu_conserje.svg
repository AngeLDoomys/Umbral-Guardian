<text x="746.9448048741367" y="288.30551951258633" font-size="11" font-weight="bold" fill="#3d4450" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="746.9448048741367" dy="0">«include»</tspan></text>
