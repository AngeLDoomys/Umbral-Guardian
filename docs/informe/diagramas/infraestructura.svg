<text x="1249" y="244" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="1249" dy="0">Amazon EC2</tspan><tspan x="1249" dy="16.799999999999997">aloja la API y el formulario</tspan><tspan x="1249" dy="16.799999999999997">del registro por QR</tspan></text>
