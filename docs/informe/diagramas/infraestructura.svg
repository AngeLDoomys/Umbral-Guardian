<text x="965.0" y="36" font-size="26" font-weight="bold" fill="#16203a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="965.0" dy="0">Infraestructura física</tspan></text>
<text x="965.0" y="64" font-size="13.5" font-weight="normal" fill="#5b6270" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="965.0" dy="0">Qué equipo hay, dónde está y cuál se compra. Sin protocolos ni puertos: eso va en topología.</tspan></text>
<text x="53" y="130" font-size="17" font-weight="bold" fill="#2f5b94" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="53" dy="0">En el pórtico</tspan></text>
<text x="512" y="130" font-size="17" font-weight="bold" fill="#2f5b94" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="512" dy="0">En la caseta de conserjería</tspan></text>
<text x="1227" y="130" font-size="17" font-weight="bold" fill="#2f5b94" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="1227" dy="0">En la nube</tspan></text>
<text x="1645" y="130" font-size="15.5" font-weight="bold" fill="#9a6a12" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="1645" dy="0">En manos de cada persona</tspan></text>
