<text x="1249" y="394" font-size="17" font-weight="bold" fill="#16203a" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="1249" dy="0">Base de datos central</tspan></text>
<text x="1249" y="418" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="1249" dy="0">Amazon RDS</tspan><tspan x="1249" dy="16.799999999999997">sólo administración</tspan></text>
<text x="1492.8" y="468.5" font-size="11.5" font-weight="bold" fill="#1f7a6a" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="1492.8" dy="0">SE ARRIENDA</tspan></text>
<text x="1659" y="220" font-size="17" font-weight="bold" fill="#16203a" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="1659" dy="0">Celular</tspan></text>
<text x="1659" y="244" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="1659" dy="0">del residente o la visita</tspan><tspan x="1659" dy="16.799999999999997">abre el QR y envía</tspan><tspan x="1659" dy="16.799999999999997">sus datos y fotos</tspan></text>
