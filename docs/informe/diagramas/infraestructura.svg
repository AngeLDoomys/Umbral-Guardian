<text x="81" y="388" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="81" dy="0">ya instalados en el condominio</tspan><tspan x="81" dy="16.799999999999997">el proyecto no los interviene</tspan></text>
<text x="360.2" y="429.5" font-size="11.5" font-weight="bold" fill="#2f8a57" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="360.2" dy="0">YA EXISTE</tspan></text>
<text x="534" y="205" font-size="17" font-weight="bold" fill="#16203a" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="534" dy="0">Grabador de video</tspan></text>
<text x="534" y="229" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="534" dy="0">Hikvision · ocho canales</tspan><tspan x="534" dy="16.799999999999997">no se configura</tspan><tspan x="534" dy="16.799999999999997">ni se reemplaza</tspan></text>
