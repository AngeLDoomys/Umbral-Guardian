<text x="55" y="585" font-size="15" font-weight="bold" fill="#6b4a08" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="55" dy="0">Todo cuelga del router: una sola red.</tspan></text>
<text x="55" y="609" font-size="12" font-weight="normal" fill="#6b4a08" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="55" dy="0">El grabador y el PC cuelgan los dos del router, así que el PC le pide el video al grabador por la misma red por la que después sale a internet. No hay cable directo entre ellos.</tspan><tspan x="55" dy="18.6">Y no se compra ninguna cámara: las dos del ingreso ya existen. Del proyecto sale sólo el PC dedicado y la cámara de enrolar.</tspan><tspan x="55" dy="18.6">El registro por QR no agrega equipo: cada residente o visita usa su propio celular, que se conecta sólo a la nube.</tspan></text></svg>