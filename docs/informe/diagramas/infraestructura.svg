<text x="81" y="229" font-size="12" font-weight="normal" fill="#5b6270" text-anchor="start" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="81" dy="0">una vehicular y una peatonal</tspan><tspan x="81" dy="16.799999999999997">conectadas al grabador</tspan></text>
<text x="360.2" y="270.5" font-size="11.5" font-weight="bold" fill="#2f8a57" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"><tspan x="360.2" dy="0">YA EXISTE</tspan></text>
